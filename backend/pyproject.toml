[project]
name = "codeshieldai-backend"
version = "1.1.0"
description = "AI-assisted code vulnerability scanner — FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "bandit>=1.7",
    "flawfinder>=2.0",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
